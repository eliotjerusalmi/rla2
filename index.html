<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MediDéliv — Planification des tournées</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
:root {
  --bg:       #0d0f12;
  --surface:  #161921;
  --surface2: #1e2330;
  --border:   #2a3040;
  --accent:   #4af0a8;
  --accent2:  #f04a6e;
  --amber:    #f0b84a;
  --blue:     #4a9ef0;
  --text:     #e8ecf4;
  --muted:    #7a8499;
  --font:     'Syne', sans-serif;
  --mono:     'DM Mono', monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: var(--font); min-height: 100vh; }

/* ── Header ── */
header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 28px; height: 56px;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
}
.logo { font-size: 18px; font-weight: 800; letter-spacing: -0.5px; }
.logo span { color: var(--accent); }
.badge { font-family: var(--mono); font-size: 11px; background: var(--surface2); border: 1px solid var(--border); padding: 3px 10px; border-radius: 20px; color: var(--muted); }

/* ── Layout ── */
.app { display: grid; grid-template-columns: 360px 1fr; height: calc(100vh - 56px); }

/* ── Sidebar ── */
.sidebar {
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  overflow: hidden;
}
.sidebar-tabs { display: flex; border-bottom: 1px solid var(--border); }
.tab {
  flex: 1; padding: 12px 0; text-align: center; font-size: 12px; font-weight: 600;
  letter-spacing: .5px; text-transform: uppercase; cursor: pointer;
  color: var(--muted); border-bottom: 2px solid transparent;
  transition: color .2s, border-color .2s;
}
.tab.active { color: var(--accent); border-bottom-color: var(--accent); }

.panel { display: none; flex-direction: column; flex: 1; overflow: hidden; }
.panel.active { display: flex; }

/* ── Formulaire livraison ── */
.form-scroll { flex: 1; overflow-y: auto; padding: 16px; }
.form-scroll::-webkit-scrollbar { width: 4px; }
.form-scroll::-webkit-scrollbar-track { background: transparent; }
.form-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.field-group { margin-bottom: 14px; }
label { display: block; font-size: 11px; font-weight: 600; letter-spacing: .5px; text-transform: uppercase; color: var(--muted); margin-bottom: 5px; }
input, select {
  width: 100%; padding: 9px 12px; background: var(--surface2); border: 1px solid var(--border);
  border-radius: 6px; color: var(--text); font-family: var(--font); font-size: 13px;
  outline: none; transition: border-color .2s;
}
input:focus, select:focus { border-color: var(--accent); }
input[type=range] { padding: 0; height: 4px; cursor: pointer; accent-color: var(--accent); }

.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.checkbox-row { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
.checkbox-row input[type=checkbox] { width: auto; accent-color: var(--accent); }
.checkbox-row span { font-size: 13px; color: var(--muted); }

.btn-add {
  width: 100%; padding: 11px; background: transparent; border: 1px dashed var(--accent);
  border-radius: 8px; color: var(--accent); font-family: var(--font); font-size: 13px;
  font-weight: 600; cursor: pointer; transition: background .2s;
}
.btn-add:hover { background: rgba(74,240,168,.07); }

.delivery-list { margin-top: 16px; }
.delivery-item {
  display: flex; justify-content: space-between; align-items: center;
  padding: 10px 12px; background: var(--surface2); border: 1px solid var(--border);
  border-radius: 8px; margin-bottom: 8px; font-size: 13px;
}
.delivery-item .dname { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 180px; }
.delivery-item .dmeta { font-family: var(--mono); font-size: 11px; color: var(--muted); }
.del-btn { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 16px; padding: 0 4px; }
.del-btn:hover { color: var(--accent2); }

.pill {
  font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 20px;
  text-transform: uppercase; letter-spacing: .3px; flex-shrink: 0;
}
.pill-urgent  { background: rgba(240,74,110,.15); color: var(--accent2); border: 1px solid rgba(240,74,110,.3); }
.pill-hospital { background: rgba(74,158,240,.15); color: var(--blue); border: 1px solid rgba(74,158,240,.3); }
.pill-clinic   { background: rgba(240,184,74,.15); color: var(--amber); border: 1px solid rgba(240,184,74,.3); }
.pill-pharmacy { background: rgba(74,240,168,.15); color: var(--accent); border: 1px solid rgba(74,240,168,.3); }

/* ── Boutons action ── */
.sidebar-footer { padding: 16px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; }
.btn-plan {
  width: 100%; padding: 13px; background: var(--accent); border: none;
  border-radius: 8px; color: #0d0f12; font-family: var(--font); font-size: 14px;
  font-weight: 700; cursor: pointer; letter-spacing: .3px; transition: opacity .2s;
}
.btn-plan:hover { opacity: .85; }
.btn-demo {
  width: 100%; padding: 11px; background: transparent; border: 1px solid var(--border);
  border-radius: 8px; color: var(--muted); font-family: var(--font); font-size: 13px;
  cursor: pointer; transition: border-color .2s, color .2s;
}
.btn-demo:hover { border-color: var(--muted); color: var(--text); }

/* ── Panel résultats ── */
.results-scroll { flex: 1; overflow-y: auto; padding: 16px; }
.route-card {
  background: var(--surface2); border: 1px solid var(--border); border-radius: 10px;
  margin-bottom: 14px; overflow: hidden;
}
.route-header {
  display: flex; justify-content: space-between; align-items: center;
  padding: 12px 14px; cursor: pointer; user-select: none;
}
.route-header:hover { background: rgba(255,255,255,.03); }
.route-name { font-weight: 700; font-size: 14px; }
.route-meta { font-family: var(--mono); font-size: 11px; color: var(--muted); }
.route-stats { display: flex; gap: 14px; }
.stat { text-align: right; }
.stat .v { font-family: var(--mono); font-size: 13px; font-weight: 500; color: var(--accent); }
.stat .k { font-size: 10px; color: var(--muted); text-transform: uppercase; }
.route-stops { padding: 0 14px 12px; border-top: 1px solid var(--border); display: none; }
.route-stops.open { display: block; }
.stop-row {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 8px 0; border-bottom: 1px solid var(--border);
  font-size: 13px;
}
.stop-row:last-child { border-bottom: none; }
.stop-time { font-family: var(--mono); font-size: 12px; color: var(--muted); min-width: 40px; padding-top: 1px; }
.stop-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; margin-top: 4px; }
.stop-info .sname { font-weight: 600; }
.stop-info .sdist { font-size: 11px; color: var(--muted); margin-top: 2px; }
.late-badge { font-size: 10px; color: var(--accent2); font-weight: 600; }

.empty-state { text-align: center; padding: 48px 24px; color: var(--muted); }
.empty-state .big { font-size: 32px; margin-bottom: 12px; }
.empty-state p { font-size: 13px; line-height: 1.6; }

/* ── Carte ── */
.map-container { position: relative; }
#map { width: 100%; height: 100%; }
.map-legend {
  position: absolute; bottom: 20px; right: 20px; z-index: 1000;
  background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
  padding: 12px 14px; font-size: 12px;
}
.legend-item { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.legend-item:last-child { margin-bottom: 0; }
.ldot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

/* ── Toast ── */
#toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(60px);
  background: var(--surface2); border: 1px solid var(--border); border-radius: 8px;
  padding: 10px 20px; font-size: 13px; transition: transform .3s; z-index: 9999;
  pointer-events: none;
}
#toast.show { transform: translateX(-50%) translateY(0); }

/* ── Stats bar ── */
.stats-bar {
  display: grid; grid-template-columns: repeat(4, 1fr);
  border-top: 1px solid var(--border); background: var(--surface);
}
.stats-bar .sitem {
  padding: 10px 16px; border-right: 1px solid var(--border); text-align: center;
}
.stats-bar .sitem:last-child { border-right: none; }
.stats-bar .sv { font-family: var(--mono); font-size: 16px; font-weight: 500; color: var(--accent); }
.stats-bar .sk { font-size: 10px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); margin-top: 2px; }

/* spinner */
.spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid #0d0f12; border-top-color: transparent; border-radius: 50%; animation: spin .7s linear infinite; vertical-align: middle; margin-right: 6px; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<header>
  <div class="logo">Medi<span>Déliv</span></div>
  <div style="display:flex;gap:10px;align-items:center">
    <span class="badge">RLA — EPITA 2025</span>
    <span class="badge" id="status-badge">● Prêt</span>
  </div>
</header>

<div class="app">

  <!-- ── SIDEBAR ── -->
  <div class="sidebar">
    <div class="sidebar-tabs">
      <div class="tab active" data-tab="form">Livraisons</div>
      <div class="tab" data-tab="results">Planning</div>
    </div>

    <!-- Panel saisie -->
    <div class="panel active" id="panel-form">
      <div class="form-scroll">
        <div class="field-group">
          <label>Adresse de livraison</label>
          <select id="addr-select">
            <option value="">— Sélectionner une adresse —</option>
          </select>
        </div>
        <div class="row2">
          <div class="field-group">
            <label>Type</label>
            <select id="type-select">
              <option value="pharmacy">Pharmacie</option>
              <option value="clinic">Clinique</option>
              <option value="hospital">Hôpital</option>
            </select>
          </div>
          <div class="field-group">
            <label>Priorité</label>
            <select id="prio-select">
              <option value="">Standard</option>
              <option value="urgent">Urgent (&lt;2h)</option>
            </select>
          </div>
        </div>
        <div class="field-group">
          <label>Poids (kg) — <span id="weight-val">20</span> kg</label>
          <input type="range" id="weight-range" min="1" max="500" value="20" step="1">
        </div>
        <div class="field-group">
          <div class="checkbox-row">
            <input type="checkbox" id="refrig">
            <span>Produit réfrigéré (2–8°C)</span>
          </div>
        </div>
        <button class="btn-add" onclick="addDelivery()">+ Ajouter cette livraison</button>

        <div class="delivery-list" id="delivery-list"></div>
      </div>
      <div class="sidebar-footer">
        <button class="btn-plan" id="btn-plan" onclick="runPlan()">Calculer les tournées</button>
        <button class="btn-demo" onclick="loadDemo()">Charger la démo (15 livraisons)</button>
      </div>
    </div>

    <!-- Panel résultats -->
    <div class="panel" id="panel-results">
      <div class="results-scroll" id="results-content">
        <div class="empty-state">
          <div class="big">📋</div>
          <p>Les tournées calculées apparaîtront ici.<br>Ajoutez des livraisons et cliquez sur <strong>Calculer</strong>.</p>
        </div>
      </div>
      <div class="stats-bar" id="stats-bar" style="display:none">
        <div class="sitem"><div class="sv" id="s-routes">—</div><div class="sk">Tournées</div></div>
        <div class="sitem"><div class="sv" id="s-stops">—</div><div class="sk">Arrêts</div></div>
        <div class="sitem"><div class="sv" id="s-km">—</div><div class="sk">Km total</div></div>
        <div class="sitem"><div class="sv" id="s-fuel">—</div><div class="sk">Carburant €</div></div>
      </div>
    </div>
  </div>

  <!-- ── MAP ── -->
  <div class="map-container">
    <div id="map"></div>
    <div class="map-legend">
      <div class="legend-item"><div class="ldot" style="background:#4af0a8"></div>Pharmacie</div>
      <div class="legend-item"><div class="ldot" style="background:#f0b84a"></div>Clinique</div>
      <div class="legend-item"><div class="ldot" style="background:#4a9ef0"></div>Hôpital</div>
      <div class="legend-item"><div class="ldot" style="background:#f04a6e"></div>Urgent</div>
      <div class="legend-item"><div class="ldot" style="background:#ffffff"></div>Dépôt</div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// ── État global ──────────────────────────────────────────────────────────────
let deliveries = [];
let addresses  = [];
let map, markers = [], polylines = [];

const ROUTE_COLORS = ['#4af0a8','#f0b84a','#4a9ef0','#f04a6e','#b84af0','#f04ab8','#a8f04a'];

const TYPE_COLOR = { pharmacy: '#4af0a8', clinic: '#f0b84a', hospital: '#4a9ef0', urgent: '#f04a6e' };

// ── Carte ────────────────────────────────────────────────────────────────────
function initMap() {
  map = L.map('map', { zoomControl: true }).setView([48.82, 2.38], 11);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    attribution: '© OpenStreetMap © CARTO', maxZoom: 19
  }).addTo(map);
  // Dépôt
  addDepotMarker();
}

function addDepotMarker() {
  const depotIcon = L.divIcon({
    html: `<div style="width:14px;height:14px;background:#fff;border:2px solid #0d0f12;border-radius:50%;box-shadow:0 0 0 2px #fff"></div>`,
    iconAnchor: [7,7], className: ''
  });
  L.marker([48.8145, 2.3871], { icon: depotIcon }).addTo(map)
    .bindPopup('<b>Dépôt Ivry-sur-Seine</b>');
}

function clearMap() {
  markers.forEach(m => map.removeLayer(m));
  polylines.forEach(p => map.removeLayer(p));
  markers = []; polylines = [];
}

function deliveryIcon(d) {
  const color = d.priority === 'urgent' ? '#f04a6e' : TYPE_COLOR[d.type] || '#4af0a8';
  return L.divIcon({
    html: `<div style="width:10px;height:10px;background:${color};border-radius:50%;border:1px solid #0d0f12;opacity:.85"></div>`,
    iconAnchor: [5,5], className: ''
  });
}

function drawDeliveriesOnMap() {
  clearMap();
  deliveries.forEach(d => {
    const m = L.marker([d.lat, d.lon], { icon: deliveryIcon(d) }).addTo(map);
    m.bindTooltip(`<b>${d.name}</b><br>${d.type}${d.priority==='urgent'?' · URGENT':''}<br>${d.weight} kg`);
    markers.push(m);
  });
}

function drawRoutes(routes) {
  clearMap();
  addDepotMarker();
  const depot = [48.8145, 2.3871];
  routes.forEach((route, ri) => {
    const color = ROUTE_COLORS[ri % ROUTE_COLORS.length];
    const latlngs = [depot, ...route.stops.map(s => [s.lat, s.lon]), depot];
    const line = L.polyline(latlngs, { color, weight: 2, opacity: .7 }).addTo(map);
    polylines.push(line);
    route.stops.forEach(s => {
      const c = s.priority === 'urgent' ? '#f04a6e' : TYPE_COLOR[s.type] || '#4af0a8';
      const icon = L.divIcon({
        html: `<div style="width:10px;height:10px;background:${c};border-radius:50%;border:2px solid ${color}"></div>`,
        iconAnchor:[5,5], className:''
      });
      const m = L.marker([s.lat, s.lon], { icon }).addTo(map);
      m.bindTooltip(`<b>${s.name}</b><br>Arrivée: ${s.arrival}${s.status==='late'?' ⚠ RETARD':''}`);
      markers.push(m);
    });
  });
  if (latlngs) map.fitBounds(routes.flatMap(r => r.stops.map(s => [s.lat, s.lon])).concat([depot]), { padding: [30,30] });
}

// ── Données embarquées (pas de serveur requis) ────────────────────────────────
const ADDRESSES_DATA = [
  {"name":"Pharmacie du Châtelet",     "lat":48.8604,"lon":2.3477,"type":"pharmacy"},
  {"name":"Clinique Saint-Antoine",    "lat":48.8491,"lon":2.3874,"type":"clinic"},
  {"name":"Pharmacie Nation",          "lat":48.8486,"lon":2.3965,"type":"pharmacy"},
  {"name":"Hôpital Lariboisière",      "lat":48.8797,"lon":2.3568,"type":"hospital"},
  {"name":"Pharmacie Montparnasse",    "lat":48.8424,"lon":2.3218,"type":"pharmacy"},
  {"name":"Clinique du Trocadéro",     "lat":48.8637,"lon":2.2905,"type":"clinic"},
  {"name":"Pharmacie Opéra",           "lat":48.8706,"lon":2.3318,"type":"pharmacy"},
  {"name":"Hôpital Bicêtre",           "lat":48.7895,"lon":2.3538,"type":"hospital"},
  {"name":"Pharmacie Vincennes",       "lat":48.8480,"lon":2.4390,"type":"pharmacy"},
  {"name":"Clinique des Lilas",        "lat":48.8793,"lon":2.4193,"type":"clinic"},
  {"name":"Pharmacie Boulogne",        "lat":48.8355,"lon":2.2400,"type":"pharmacy"},
  {"name":"Pharmacie Pantin",          "lat":48.8987,"lon":2.4044,"type":"pharmacy"},
  {"name":"Hôpital Avicenne Bobigny",  "lat":48.9050,"lon":2.4412,"type":"hospital"},
  {"name":"Pharmacie Montreuil",       "lat":48.8646,"lon":2.4481,"type":"pharmacy"},
  {"name":"Clinique Massy",            "lat":48.7259,"lon":2.2735,"type":"clinic"},
  {"name":"Pharmacie Versailles",      "lat":48.8044,"lon":2.1314,"type":"pharmacy"},
  {"name":"Pharmacie Créteil",         "lat":48.7771,"lon":2.4558,"type":"pharmacy"},
  {"name":"Hôpital Henri Mondor",      "lat":48.7869,"lon":2.4652,"type":"hospital"},
  {"name":"Pharmacie Saint-Denis",     "lat":48.9359,"lon":2.3618,"type":"pharmacy"},
  {"name":"Clinique Rambouillet",      "lat":48.6450,"lon":1.8327,"type":"clinic"},
];

const VEHICLES_DATA = [
  {"id":"V1","name":"Scooter électrique 1","type":"scooter","capacity":30, "range":60, "fuel_per_km":0.0, "speed":25},
  {"id":"V2","name":"Scooter électrique 2","type":"scooter","capacity":30, "range":60, "fuel_per_km":0.0, "speed":25},
  {"id":"V3","name":"Camionnette frigo 1", "type":"van",    "capacity":800,"range":150,"fuel_per_km":0.09,"speed":40},
  {"id":"V4","name":"Camionnette frigo 2", "type":"van",    "capacity":800,"range":150,"fuel_per_km":0.09,"speed":40},
  {"id":"V5","name":"Camionnette frigo 3", "type":"van",    "capacity":800,"range":150,"fuel_per_km":0.09,"speed":40},
  {"id":"V6","name":"Grand van isotherme", "type":"bigvan", "capacity":1500,"range":300,"fuel_per_km":0.12,"speed":35},
];

const DRIVERS_DATA = [
  {"id":"D1","name":"Ahmed B.",  "start":"07:00","max_drive":9},
  {"id":"D2","name":"Sophie M.", "start":"07:00","max_drive":9},
  {"id":"D3","name":"Karim L.",  "start":"06:30","max_drive":9},
  {"id":"D4","name":"Nadia P.",  "start":"08:00","max_drive":9},
  {"id":"D5","name":"Thomas R.", "start":"07:30","max_drive":9},
];

const TIME_WINDOWS = {pharmacy:["08:00","18:00"], clinic:["07:00","14:00"], hospital:["06:00","12:00"]};
const DEPOT = {lat:48.8145, lon:2.3871};

function timeToMin(t){const[h,m]=t.split(":").map(Number);return h*60+m;}
function minToTime(m){return`${Math.floor(m/60).toString().padStart(2,'0')}:${Math.floor(m%60).toString().padStart(2,'0')}`;}
function haversine(la1,lo1,la2,lo2){const R=6371,dlat=(la2-la1)*Math.PI/180,dlon=(lo2-lo1)*Math.PI/180,a=Math.sin(dlat/2)**2+Math.cos(la1*Math.PI/180)*Math.cos(la2*Math.PI/180)*Math.sin(dlon/2)**2;return R*2*Math.asin(Math.sqrt(a));}

function planDeliveries(delivs) {
  const PRIO = {urgent:0,hospital:1,clinic:2,pharmacy:3};
  const sorted = [...delivs].sort((a,b)=>(PRIO[a.priority]??3)-(PRIO[b.priority]??3)||timeToMin(TIME_WINDOWS[a.type][1])-timeToMin(TIME_WINDOWS[b.type][1]));
  const routes = {};
  VEHICLES_DATA.forEach((v,i)=>{ routes[v.id]={vehicle:v,stops:[],total_weight:0,driver:DRIVERS_DATA[i%DRIVERS_DATA.length]}; });
  const unassigned=[];
  sorted.forEach(d=>{
    const distDepot=haversine(DEPOT.lat,DEPOT.lon,d.lat,d.lon);
    const candidates=[];
    Object.entries(routes).forEach(([vid,r])=>{
      const v=r.vehicle;
      if(r.total_weight+d.weight<=v.capacity && distDepot*2<=v.range){
        const last=r.stops.length?r.stops[r.stops.length-1]:DEPOT;
        candidates.push([haversine(last.lat,last.lon,d.lat,d.lon),vid]);
      }
    });
    if(candidates.length){candidates.sort((a,b)=>a[0]-b[0]);const vid=candidates[0][1];routes[vid].stops.push(d);routes[vid].total_weight+=d.weight;}
    else unassigned.push(d);
  });
  const result=[];
  Object.values(routes).forEach(r=>{
    if(!r.stops.length)return;
    const v=r.vehicle,drv=r.driver;
    let curMin=timeToMin(drv.start),curLat=DEPOT.lat,curLon=DEPOT.lon,totalDist=0,driveTime=0;
    const stops=r.stops.map(s=>{
      const dist=haversine(curLat,curLon,s.lat,s.lon),travelMin=dist/v.speed*60;
      driveTime+=travelMin;
      if(driveTime>270){curMin+=30;driveTime=0;}
      let arr=curMin+travelMin;
      const open=timeToMin(TIME_WINDOWS[s.type][0]),close=timeToMin(TIME_WINDOWS[s.type][1]);
      if(arr<open)arr=open;
      const status=arr>close?'late':'ok';
      totalDist+=dist;curMin=arr+10;curLat=s.lat;curLon=s.lon;
      return{...s,arrival:minToTime(arr),departure:minToTime(arr+10),distance_from_prev:Math.round(dist*10)/10,status};
    });
    const retDist=haversine(curLat,curLon,DEPOT.lat,DEPOT.lon);
    totalDist+=retDist;
    result.push({vehicle:v,driver:drv,stops,total_dist:Math.round(totalDist*10)/10,total_weight:r.total_weight,return_time:minToTime(curMin+retDist/v.speed*60),fuel_cost:Math.round(totalDist*v.fuel_per_km*1.85*100)/100});
  });
  return{routes:result,unassigned};
}

// ── Chargement adresses ──────────────────────────────────────────────────────
function loadAddresses() {
  addresses = ADDRESSES_DATA;
  const sel = document.getElementById('addr-select');
  addresses.forEach(a => {
    const opt = document.createElement('option');
    opt.value = JSON.stringify(a);
    opt.textContent = a.name;
    sel.appendChild(opt);
  });
}

// ── Gestion livraisons ───────────────────────────────────────────────────────
function addDelivery() {
  const addrRaw = document.getElementById('addr-select').value;
  if (!addrRaw) { toast('Sélectionnez une adresse'); return; }
  const addr  = JSON.parse(addrRaw);
  const type  = document.getElementById('type-select').value;
  const prio  = document.getElementById('prio-select').value;
  const weight= parseInt(document.getElementById('weight-range').value);
  const refrig= document.getElementById('refrig').checked;

  deliveries.push({
    id: `LIV${Date.now()}`, name: addr.name, lat: addr.lat, lon: addr.lon,
    type, priority: prio || type, weight, refrigerated: refrig,
  });
  renderDeliveryList();
  drawDeliveriesOnMap();
  toast(`Livraison ajoutée : ${addr.name}`);
}

function removeDelivery(id) {
  deliveries = deliveries.filter(d => d.id !== id);
  renderDeliveryList();
  drawDeliveriesOnMap();
}

function renderDeliveryList() {
  const el = document.getElementById('delivery-list');
  if (!deliveries.length) { el.innerHTML = ''; return; }
  el.innerHTML = deliveries.map(d => `
    <div class="delivery-item">
      <div>
        <div class="dname">${d.name}</div>
        <div class="dmeta">${d.weight} kg${d.refrigerated?' · ❄':''}${d.priority==='urgent'?' · URGENT':''}</div>
      </div>
      <div style="display:flex;align-items:center;gap:6px">
        <span class="pill pill-${d.priority==='urgent'?'urgent':d.type}">${d.priority==='urgent'?'URGENT':d.type}</span>
        <button class="del-btn" onclick="removeDelivery('${d.id}')">×</button>
      </div>
    </div>`).join('');
}

// ── Planification ────────────────────────────────────────────────────────────
function runPlan() {
  if (!deliveries.length) { toast('Aucune livraison à planifier'); return; }
  const btn = document.getElementById('btn-plan');
  btn.innerHTML = '<span class="spinner"></span>Calcul…';
  btn.disabled = true;
  setTimeout(() => {
    try {
      const data = planDeliveries(deliveries);
      renderResults(data.routes, data.unassigned || []);
      drawRoutes(data.routes);
      switchTab('results');
    } catch(e) { toast('Erreur : ' + e.message); }
    finally { btn.innerHTML = 'Calculer les tournées'; btn.disabled = false; }
  }, 300);
}

function loadDemo() {
  const weights = [5,10,15,20,25,40,80,150];
  deliveries = ADDRESSES_DATA.slice(0,15).map((a,i) => ({
    id: `LIV${String(i+1).padStart(3,'0')}`,
    ...a,
    priority: i%7===0?'urgent':a.type,
    weight: weights[i%weights.length],
    refrigerated: a.type==='hospital'||i%4===0,
  }));
  renderDeliveryList();
  const data = planDeliveries(deliveries);
  renderResults(data.routes, data.unassigned || []);
  drawRoutes(data.routes);
  switchTab('results');
  toast('Démo chargée : 15 livraisons planifiées');
}

// ── Affichage résultats ──────────────────────────────────────────────────────
function renderResults(routes, unassigned) {
  const el = document.getElementById('results-content');
  if (!routes.length) { el.innerHTML = '<div class="empty-state"><div class="big">⚠️</div><p>Aucune tournée générée.</p></div>'; return; }

  let totalKm = 0, totalFuel = 0, totalStops = 0;

  const html = routes.map((r, i) => {
    const color = ROUTE_COLORS[i % ROUTE_COLORS.length];
    totalKm   += r.total_dist;
    totalFuel += r.fuel_cost;
    totalStops+= r.stops.length;
    const lateCount = r.stops.filter(s => s.status === 'late').length;
    const stopsHtml = r.stops.map(s => {
      const c = s.priority === 'urgent' ? '#f04a6e' : TYPE_COLOR[s.type] || '#4af0a8';
      return `<div class="stop-row">
        <div class="stop-time">${s.arrival}</div>
        <div class="stop-dot" style="background:${c}"></div>
        <div class="stop-info">
          <div class="sname">${s.name} ${s.status==='late'?'<span class="late-badge">⚠ RETARD</span>':''}</div>
          <div class="sdist">+${s.distance_from_prev} km · ${s.weight} kg${s.refrigerated?' · ❄':''}</div>
        </div>
      </div>`;
    }).join('');
    return `<div class="route-card">
      <div class="route-header" onclick="toggleRoute(this)">
        <div>
          <div class="route-name" style="color:${color}">${r.vehicle.name}</div>
          <div class="route-meta">${r.driver.name} · retour ${r.return_time}${lateCount?` · <span style="color:var(--accent2)">${lateCount} retard${lateCount>1?'s':''}</span>`:''}</div>
        </div>
        <div class="route-stats">
          <div class="stat"><div class="v">${r.stops.length}</div><div class="k">Arrêts</div></div>
          <div class="stat"><div class="v">${r.total_dist} km</div><div class="k">Distance</div></div>
          <div class="stat"><div class="v">${r.total_weight} kg</div><div class="k">Charge</div></div>
        </div>
      </div>
      <div class="route-stops">${stopsHtml}</div>
    </div>`;
  }).join('');

  const unHtml = unassigned.length ? `
    <div style="padding:12px;background:rgba(240,74,110,.08);border:1px solid rgba(240,74,110,.2);border-radius:8px;margin-bottom:14px;font-size:13px;color:var(--accent2)">
      ⚠ ${unassigned.length} livraison(s) non affectée(s) : ${unassigned.map(d=>d.name).join(', ')}
    </div>` : '';

  el.innerHTML = unHtml + html;

  document.getElementById('stats-bar').style.display = 'grid';
  document.getElementById('s-routes').textContent  = routes.length;
  document.getElementById('s-stops').textContent   = totalStops;
  document.getElementById('s-km').textContent      = Math.round(totalKm) + ' km';
  document.getElementById('s-fuel').textContent    = totalFuel.toFixed(0) + ' €';
}

function toggleRoute(header) {
  const stops = header.nextElementSibling;
  stops.classList.toggle('open');
}

// ── UI ───────────────────────────────────────────────────────────────────────
function switchTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
  document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.id === 'panel-' + name));
}
document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => switchTab(t.dataset.tab)));

document.getElementById('weight-range').addEventListener('input', function() {
  document.getElementById('weight-val').textContent = this.value;
});

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2800);
}

// ── Init ─────────────────────────────────────────────────────────────────────
initMap();
loadAddresses();
</script>
</body>
</html>
